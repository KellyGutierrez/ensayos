<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Evaluador de Ensayos</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="main.css" />
</head>
<body>
  <header class="fade-in">Evaluador de Ensayos</header>

  <main>
    <div class="container fade-in">
      <form id="upload-form">
        <label for="file-input">Selecciona uno o más archivos:</label>
        
        <div class="drop-area">
          <h2>Arrastra y suelta los archivos</h2>
          <span>O</span>
          <button id="custom-button" type="button">Selecciona tus archivos</button>
          <input type="file" id="input-file" hidden multiple>
        </div>
        
        <div id="preview"></div>

        <label for="instructions">Instrucciones adicionales:</label>
        <input type="text" id="instructions" name="instructions" placeholder="Ej: Evalúa la coherencia del texto" />
      
        <button type="submit">📤 Subir Archivos</button>
        <div id="status"></div>
      </form>
    </div>

    <section>
      <h2 class="fade-in">📄 Resultados Individuales</h2>
      <div id="results">
        <table id="results-table">
          <thead>
            <tr>
              <th>Autor</th>
              <th>Archivo</th>
              <th>Evaluación</th>
              <th>Audio</th>
            </tr>
          </thead>
          <tbody id="results-body">
            <!-- Aquí se agregarán las filas dinámicamente con JavaScript -->
          </tbody>
        </table>
      </div>
    </section>

    <section>
      <h2 class="fade-in">🧑‍🤝‍🧑 Evaluación Grupal</h2>
      <div id="group-review-container"></div> <!-- Aquí se generará la tabla dinámicamente -->
    </section>
    
  
  
  </main>

  <script src="index.js"></script>
</body>
</html>
